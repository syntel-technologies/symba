# nginx serving the Symba operator SPA (the SPA ships as a SEPARATE
# container, NOT embedded in the engine image). Same-origin proxying to the engine
# keeps authenticated fetch-based SSE same-origin and lets the browser talk to one host.
#
# ENGINE_HOST/ENGINE_PORT are substituted at container start (see docker entrypoint
# envsubst) so the same image points at any engine.

server {
    listen ${NGINX_LISTEN_PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback: unknown paths render index.html so client-side routing
    # (/jobs/:id, /pipeline, ...) survives a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Image-baked coordinated-release attestation. This file is generated from
    # build args, not runtime environment, and the entrypoint independently
    # rejects a desired/image provenance mismatch before nginx starts.
    location = /release-provenance.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        try_files /release-provenance.json =404;
    }

    # Control plane + metrics -> engine HTTP port.
    location /v1/ {
        proxy_pass http://${ENGINE_HOST}:${ENGINE_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # SSE: disable buffering and idle timeouts so /v1/events/stream streams live.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";
    }

    location /metrics {
        proxy_pass http://${ENGINE_HOST}:${ENGINE_PORT};
        proxy_set_header Host $host;
    }
}
