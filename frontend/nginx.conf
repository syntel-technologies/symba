# nginx serving the Symba operator SPA (the SPA ships as a SEPARATE
# container, NOT embedded in the engine image). Same-origin proxying to the engine
# keeps EventSource (SSE) working without CORS and lets the browser talk to one host.
#
# ENGINE_HOST/ENGINE_PORT are substituted at container start (see docker entrypoint
# envsubst) so the same image points at any engine.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback: unknown paths render index.html so client-side routing
    # (/jobs/:id, /pipeline, ...) survives a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Control plane + metrics -> engine HTTP port.
    location /v1/ {
        proxy_pass http://${ENGINE_HOST}:${ENGINE_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # SSE: disable buffering and idle timeouts so /v1/events/stream streams live.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";
    }

    location /metrics {
        proxy_pass http://${ENGINE_HOST}:${ENGINE_PORT};
        proxy_set_header Host $host;
    }
}
