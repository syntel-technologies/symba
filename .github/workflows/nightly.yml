# Nightly suite: L5 chaos + L6 load with a stored baseline. These are
# too slow / infra-heavy for every PR, so they run on a schedule (and on-demand via
# workflow_dispatch). The load job enforces a regression gate: a >20% drop in
# submit throughput vs the committed baseline fails the run.
name: nightly

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: {}

env:
  UV_VERSION: "0.11"
  PYTHON_VERSION: "3.13"

jobs:
  chaos-l5:
    # Scenarios 1-2: crash convergence + effect-once. Run against a real
    # Postgres 18 exactly like the L2 job.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_USER: symba
          POSTGRES_PASSWORD: symba
          POSTGRES_DB: symba
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U symba"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      SYMBA_POSTGRES__DSN: postgresql://symba:symba@localhost:5432/symba
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv pip install --system -e ".[dev]"
      - name: L5 chaos scenarios 1-2
        run: pytest -m l5 -q
      - name: L6 dispatcher latency floor (worker-free, DB-clock)
        run: pytest -m l6 -q

  load-l6:
    # Submit-throughput baseline. Brings the full stack
    # up via compose, warms it, runs k6 v2, and compares against the committed baseline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: bring the stack up (engine + PG18 + flyway)
        run: docker compose up -d --wait
      - name: install k6 v2
        run: |
          curl -fsSL https://github.com/grafana/k6/releases/download/v2.0.0/k6-v2.0.0-linux-amd64.tar.gz \
            | tar -xz --strip-components=1 -C /usr/local/bin k6-v2.0.0-linux-amd64/k6
          k6 version
      - name: k6 submit-throughput (thresholds are the pass/fail gate)
        run: k6 run -e SYMBA_URL=http://localhost:8080 tests/load/submit_throughput.js
      - name: k6 ready-to-claim p95 (busy-system scenario, target < 150ms)
        run: k6 run -e SYMBA_URL=http://localhost:8080 tests/load/ready_to_claim.js
      - name: regression gate vs committed baseline (>20% drop fails)
        run: python tools/load_regression_gate.py
      - name: upload run summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summaries
          path: tests/load/baseline/*.summary.json
      - name: engine logs on failure
        if: failure()
        run: docker compose logs engine
