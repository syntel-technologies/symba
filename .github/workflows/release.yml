# Release pipeline. Cuts on a SemVer tag: build+push the
# multi-arch engine image to GHCR, then attach the migration bundle + changelog to
# the GitHub Release. The tag itself is the trigger — CI (ci.yml) must already be
# green on the commit being tagged; this workflow does not re-run the full gate.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # vMAJOR.MINOR.PATCH only

permissions:
  contents: write # create the GitHub Release + upload assets
  packages: write # push the image to GHCR

jobs:
  image:
    # Multi-arch engine image -> ghcr.io/<owner>/symba:<tag> (+ :latest).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-qemu-action@v3 # arm64 emulation for the cross build
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: build & push (amd64 + arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    # Migration bundle (append-only SQL) + auto changelog attached to the Release.
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # full history for the changelog
      - name: bundle the append-only migrations
        run: |
          tar -czf symba-migrations-${{ github.ref_name }}.tar.gz -C database symba
      - name: create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true # changelog from merged PRs since the last tag
          files: |
            symba-migrations-${{ github.ref_name }}.tar.gz
          body: |
            Engine image: `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`
            (multi-arch amd64/arm64).

            Wire protocol: engine `MAJOR.MINOR` — see the compatibility matrix in the
            README. DB migrations are append-only; apply the attached bundle with Flyway
            (or the built-in runner) BEFORE starting the new engine.
