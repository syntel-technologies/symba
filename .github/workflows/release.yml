name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a stable version from reviewed main history
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 - <<'PYCODE'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag/package version mismatch'
          PYCODE
      - name: Require the reviewed changelog release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {data: release} = await github.rest.repos.getReleaseByTag({...context.repo, tag: context.ref.replace('refs/tags/', '')});
            if (release.draft || release.prerelease || !release.body) core.setFailed('A published stable release with reviewed notes is required.');
  ci:
    uses: ./.github/workflows/ci.yml

  performance:
    uses: ./.github/workflows/nightly.yml

  images:
    needs: [validate, ci, performance]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: symba, context: '.', file: Dockerfile}
          - {image: symba-frontend, context: frontend, file: frontend/Dockerfile}
          - {image: symba-flyway, context: '.', file: Dockerfile.flyway}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure image destinations
        id: destinations
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE: ${{ matrix.image }}
        run: |
          tags="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE:$GITHUB_REF_NAME"
          if [[ -n "$DOCKERHUB_NAMESPACE" ]]; then
            [[ "$DOCKERHUB_NAMESPACE" =~ ^[a-z0-9]{4,30}$ ]] || { echo 'Invalid Docker Hub namespace'; exit 1; }
            [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]] || { echo 'Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN'; exit 1; }
            tags="$tags,docker.io/$DOCKERHUB_NAMESPACE/$IMAGE:$GITHUB_REF_NAME"
          else
            echo '::notice::Docker Hub is not configured; publishing to GHCR only.'
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_NAMESPACE != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build the versioned image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.destinations.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          build-args: |
            KNOR_RELEASE_ID=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Record immutable image digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          TAG: ${{ github.ref_name }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          record = {key.lower(): os.environ[key] for key in ['IMAGE', 'DIGEST', 'TAG']}
          if namespace := os.environ['DOCKERHUB_NAMESPACE']:
              record['dockerhub_image'] = f"docker.io/{namespace}/{record['image'].rsplit('/', 1)[1]}"
          Path('image.json').write_text(json.dumps(record, indent=2) + '\n')
          PYCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.image }}
          path: image.json
  smoke:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      SYMBA_IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
      SYMBA_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the prebuilt quickstart stack
        run: docker compose -p symba-release-smoke -f compose.quickstart.yml up -d --wait --wait-timeout 180
      - name: Verify authenticated submission through the console proxy
        run: python3 tools/smoke_quickstart.py
      - name: Container diagnostics
        if: failure()
        run: docker compose -p symba-release-smoke -f compose.quickstart.yml logs --no-color --tail 100
      - name: Remove the disposable stack
        if: always()
        run: docker compose -p symba-release-smoke -f compose.quickstart.yml down -v
  assets:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: image-digests
      - name: Assemble release inventory and migration bundle
        run: |
          mkdir release-assets
          tar --sort=name --mtime="@$(git show -s --format=%ct HEAD)" --owner=0 --group=0 --numeric-owner -czf "release-assets/symba-migrations-$GITHUB_REF_NAME.tar.gz" -C database symba
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          images = [json.loads(p.read_text()) for p in sorted(Path('image-digests').glob('*/image.json'))]
          assert len(images) == 3, 'Missing release image'
          manifest = {'version': os.environ['GITHUB_REF_NAME'], 'revision': os.environ['GITHUB_SHA'], 'images': images}
          Path('release-assets/images.json').write_text(json.dumps(manifest, indent=2) + '\n')
          compose = Path('compose.quickstart.yml').read_text()
          for image in images:
              name = image['image'].rsplit('/', 1)[1]
              reference = image.get('dockerhub_image', image['image'])
              template = '${SYMBA_IMAGE_PREFIX:?Set SYMBA_IMAGE_PREFIX}/' + name + ':${SYMBA_VERSION:?Set SYMBA_VERSION}'
              assert template in compose, f'Missing quickstart image {name}'
              compose = compose.replace(template, f"{reference}@{image['digest']}")
          compose = compose.replace('${SYMBA_VERSION:?Set SYMBA_VERSION}', os.environ['GITHUB_REF_NAME'])
          Path('release-assets/compose.quickstart.yml').write_text(compose)
          PYCODE
          (cd release-assets && sha256sum * > SHA256SUMS)
      - name: Attach verified artifacts to the existing release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const {data: release} = await github.rest.repos.getReleaseByTag({...context.repo, tag: context.ref.replace('refs/tags/', '')});
            const {data: assets} = await github.rest.repos.listReleaseAssets({...context.repo, release_id: release.id});
            for (const name of fs.readdirSync('release-assets')) {
              const data = fs.readFileSync(`release-assets/${name}`);
              const existing = assets.find(asset => asset.name === name);
              if (existing) {
                const prior = await github.rest.repos.getReleaseAsset({...context.repo, asset_id: existing.id, headers: {accept: 'application/octet-stream'}});
                if (!Buffer.from(prior.data).equals(data)) throw new Error(`Refusing to replace different release asset ${name}`);
                continue;
              }
              await github.rest.repos.uploadReleaseAsset({...context.repo, release_id: release.id, name, data});
            }

  latest:
    needs: assets
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/promote-latest.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
