version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    groups:
      grpc-toolchain:
        patterns: ['grpcio*', 'protobuf']
        update-types: [minor, patch]
      compatible-python:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    target-branch: dev
    # openapi-typescript currently declares TypeScript ^5.x. Keep patch/minor
    # fixes enabled; reconsider compiler majors when the generator supports them.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      eslint-toolchain:
        patterns: ['eslint', '@eslint/*', 'eslint-plugin-*', 'typescript-eslint']
      vite-toolchain:
        patterns: ['vite', '@vitejs/*', '@tailwindcss/vite', 'tailwindcss']
      compatible-frontend:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
